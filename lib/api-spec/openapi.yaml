          "closed": {
            "type": "integer"
          },
          "nps": {
            "type": [
              "number",
              "null"
            ]
          },
          "fcr": {
            "type": [
              "number",
              "null"
            ]
          },
          "closedRate": {
            "type": [
              "number",
              "null"
            ]
