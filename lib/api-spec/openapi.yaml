          },
          "assignedTo": {
            "type": "string"
          },
          "openedAt": {
            "type": [
              "string",
              "null"
            ]
          },
          "idleSince": {
            "type": [
              "string",
              "null"
            ]
          },
          "createdAt": {
            "type": "string"
          },
          "closedAt": {
            "type": [
              "string",
              "null"
            ]
          },
          "category": {
            "type": "string"
          },
          "subcategory": {
            "type": "string"
          },
          "notes": {
            "type": "string"
          },
          "version": {
            "type": "integer"
          },
          "resolved": {
            "type": "boolean"
          },
          "firstContact": {
            "type": "boolean"
          },
          "score": {
            "type": [
              "integer",
              "null"
            ]
          },
          "messages": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Message"
            }
          }
        },
        "required": [
          "id",
          "customer",
          "status",
          "assignedTo",
          "openedAt",
          "idleSince",
          "createdAt",
          "closedAt",
          "category",
          "subcategory",
          "notes",
          "version",
          "resolved",
          "firstContact",
          "score",
          "messages"
        ]
      },
