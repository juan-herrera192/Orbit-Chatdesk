        ]
      },
      "Message": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string"
          },
          "from": {
            "type": "string",
            "enum": [
              "customer",
              "agent"
            ]
          },
          "text": {
            "type": "string"
          },
          "createdAt": {
            "type": "string"
          }
        },
        "required": [
          "id",
          "from",
          "text",
          "createdAt"
        ]
      },
      "Customer": {
        "type": "object",
        "properties": {
          "name": {
            "type": "string"
          },
          "email": {
            "type": "string"
          },
          "phone": {
            "type": "string"
          },
          "model": {
            "type": "string"
          },
          "orderNumber": {
            "type": "string"
          },
          "since": {
            "type": "string"
          }
        },
        "required": [
