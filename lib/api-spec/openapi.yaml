          "customer": {
            "$ref": "#/components/schemas/Customer"
          },
          "order": {
            "$ref": "#/components/schemas/Order"
          },
          "article": {
            "$ref": "#/components/schemas/Article"
          },
          "role": {
            "type": "string"
          },
          "name": {
            "type": "string"
          },
          "inviteCode": {
            "type": "string"
          }
        },
        "required": [
          "action"
        ]
      },
      "VisitorStartInput": {
        "type": "object",
        "properties": {
          "workspaceKey": {
            "type": "string"
          },
          "customer": {
            "$ref": "#/components/schemas/Customer"
          },
          "text": {
            "type": "string",
            "minLength": 1,
            "maxLength": 5000
          }
        },
        "required": [
          "workspaceKey",
          "customer",
          "text"
        ]
      },
      "VisitorSession": {
        "type": "object",
        "properties": {
          "token": {
            "type": "string"
          },
          "conversation": {
            "$ref": "#/components/schemas/Conversation"
          }
        },
        "required": [
          "token",
          "conversation"
        ]
      },
      "VisitorMessageInput": {
        "type": "object",
        "properties": {
          "text": {
            "type": "string",
